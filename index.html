<!DOCTYPE html>
<html lang="ko">
<head>
<title>KORA 셔틀 관제</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --navy:#1F3A68; --accent:#F28C28; --bg:#F4F6FA; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Noto Sans KR','Malgun Gothic',sans-serif; background:var(--bg); color:#222; }
  header { background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:10px 18px; height:56px; }
  header h1 { font-size:20px; margin:0; } header h1 b { color:var(--accent); }
  header .meta { font-size:14px; opacity:.9; }
  main { display:flex; height:calc(100% - 56px); }
  #map { flex:1; }
  aside { width:440px; overflow-y:auto; padding:12px; }
  .card { background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 8px; color:var(--navy); border-left:4px solid var(--accent); padding-left:8px; }
  .veh { display:grid; grid-template-columns:62px 1fr auto; gap:2px 8px; padding:8px 0; border-bottom:1px solid #eee; font-size:13px; }
  .veh:last-child { border-bottom:0; }
  .num { grid-row:span 2; font-size:20px; font-weight:700; color:var(--navy); align-self:center; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; color:#fff; font-size:12px; font-weight:600; }
  .sub { color:#666; font-size:12px; grid-column:2 / span 2; }
  .docks { display:flex; gap:8px; }
  .dock { flex:1; text-align:center; border-radius:8px; padding:10px; background:#EAF7EE; }
  .dock.busy { background:#FDECEA; } .dock .n { font-weight:700; font-size:18px; }
  .q { display:flex; justify-content:space-between; padding:4px 0; font-size:14px; }
  .empty { color:#999; font-size:13px; }
  .truck { background:var(--navy); color:#fff; border:2px solid #fff; border-radius:6px; font-weight:700; font-size:13px; padding:2px 5px; box-shadow:0 1px 4px rgba(0,0,0,.4); white-space:nowrap; }
  .stale { opacity:.5; }
  #banner { position:fixed; left:50%; top:66px; transform:translateX(-50%); background:#fff; color:var(--navy); border-left:4px solid var(--accent); padding:10px 16px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); z-index:2000; font-size:14px; display:none; }
  #banner.err { color:#C0392B; border-left-color:#C0392B; }
</style>
</head>
<body>
<header>
  <h1>KORA <b>셔틀</b> 관제 · SNT → GM 창원공장</h1>
  <div class="meta">오늘 총 회전 <b id="total">-</b> · 갱신 <span id="upd">-</span></div>
</header>
<div id="banner"></div>
<main>
  <div id="map"></div>
  <aside>
    <div class="card"><h2>하차장 사용 현황</h2><div class="docks" id="docks"></div></div>
    <div class="card"><h2>대기장소 대기 순서</h2><div id="queue"></div></div>
    <div class="card"><h2>차량 현황</h2><div id="list"></div></div>
  </aside>
</main>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbxVqdlQ9rWHB_GGuIaisd7LW0g5bousv9Zif5EpE7rUc1ZEyV2_bijXxvm03yNGkWljlA/exec';
  // GAS 콜드스타트(7~12초) 대비: 25초 타임아웃, 자동 재시도 1회
  function apiGet(params, tries) {
    tries = tries == null ? 2 : tries;
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
    return fetch(API + '?' + qs + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { clearTimeout(timer); return j; },
            function (e) { clearTimeout(timer); if (tries > 1) return apiGet(params, tries - 1); throw e; });
  }
  function errText(e) {
    return (e && e.name === 'AbortError') ? '서버 응답이 늦습니다. 잠시 후 자동으로 다시 시도합니다.' : '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
  }
  var COLORS = { '상차': '#2E86DE', '운행': '#27AE60', '하차중': '#F28C28', '대기': '#C0392B', '퇴근': '#95A5A6' };
  function colorOf(state) {
    state = String(state || '');
    for (var k in COLORS) if (state.indexOf(k) === 0) return COLORS[k];
    return '#1F3A68';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ageText(sec) {
    if (sec == null) return '위치 없음';
    if (sec < 60) return sec + '초 전';
    if (sec < 3600) return Math.floor(sec / 60) + '분 전';
    return Math.floor(sec / 3600) + '시간 전';
  }

  var map = L.map('map').setView([35.2087, 128.6775], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var zoneLayer = L.layerGroup().addTo(map), markers = {}, fitted = false;

  function render(d) {
    if (!d || !d.ok) { document.getElementById('upd').textContent = '오류: ' + esc(d && d.error); return; }
    document.getElementById('upd').textContent = d.now.slice(11, 16);
    document.getElementById('total').textContent = d.totalRounds;

    // 구역 원
    zoneLayer.clearLayers();
    var bounds = [];
    d.zones.forEach(function (z) {
      if (z.lat == null || z.lng == null) return;
      var col = z.type === 'load' ? '#2E86DE' : z.type === 'dock' ? '#F28C28' : '#C0392B';
      L.circle([z.lat, z.lng], { radius: z.r, color: col, weight: 2, fillOpacity: .12 })
        .bindTooltip(esc(z.name), { permanent: true, direction: 'top' }).addTo(zoneLayer);
      bounds.push([z.lat, z.lng]);
    });

    function spdText(v) {
      if (v.speedKmh == null || v.speedKmh === '' || isNaN(Number(v.speedKmh))) return '';
      var k = Number(v.speedKmh);
      if (k === 0) return v.stoppedMin >= 1 ? '<span class="spd">정차 ' + v.stoppedMin + '분</span>' : '<span class="spd">0 km/h</span>';
      return '<span class="spd"' + (k > 80 ? ' style="color:#d32f2f;font-weight:bold"' : '') + '>' + Math.round(k) + ' km/h</span>';
    }
    // 차량 마커
    d.vehicles.forEach(function (v) {
      if (v.lat == null || v.lng == null || v.lat === '') { if (markers[v.car]) { map.removeLayer(markers[v.car]); delete markers[v.car]; } return; }
      var stale = v.ageSec == null || v.ageSec > 600;
      var icon = L.divIcon({ className: '', iconSize: null,
        html: '<div class="truck' + (stale ? ' stale' : '') + '" style="background:' + colorOf(v.state) + '">' + esc(v.car) + '</div>' });
      var pop = '<b>' + esc(v.car) + '</b> ' + esc(v.plate) + '<br>' + esc(v.driver || '-') + ' · ' + esc(v.state) + '<br>' + ageText(v.ageSec) + (spdText(v) ? '<br>' + spdText(v) : '');
      if (markers[v.car]) markers[v.car].setLatLng([v.lat, v.lng]).setIcon(icon).setPopupContent(pop);
      else markers[v.car] = L.marker([v.lat, v.lng], { icon: icon }).bindPopup(pop).addTo(map);
      bounds.push([v.lat, v.lng]);
    });
    if (!fitted && bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 }); fitted = true; }

    // 하차장
    document.getElementById('docks').innerHTML = d.docks.length ? d.docks.map(function (k) {
      var busy = k.cars.length > 0;
      return '<div class="dock' + (busy ? ' busy' : '') + '"><div>' + esc(k.name) + '</div><div class="n">' +
        (busy ? esc(k.cars.join(', ')) : '비어있음') + '</div>' +
        (k.configured ? '' : '<div class="empty">좌표 미설정</div>') + '</div>';
    }).join('') : '<div class="empty">하차장 미등록</div>';

    // 대기열
    document.getElementById('queue').innerHTML = d.queue.length ? d.queue.map(function (q) {
      return '<div class="q"><span><b>' + q.order + '.</b> ' + esc(q.car) + '</span><span>' + esc(q.since) + ' 진입 · ' + q.waitMin + '분 대기</span></div>';
    }).join('') : '<div class="empty">대기 차량 없음</div>';

    // 차량 목록
    document.getElementById('list').innerHTML = d.vehicles.map(function (v) {
      return '<div class="veh"><div class="num">' + esc(v.car) + '</div>' +
        '<div><b>' + esc(v.driver || '(미출근)') + '</b> <span class="sub">' + esc(v.plate) + '</span></div>' +
        '<div><span class="badge" style="background:' + colorOf(v.state) + '">' + esc(v.state) + '</span></div>' +
        '<div class="sub">오늘 ' + v.rounds + '회 · 최근 출발 ' + esc(v.lastDepart || '-') +
        ' · 평균 회전 ' + (v.avgRoundMin != null ? v.avgRoundMin + '분' : '-') + ' · ' + ageText(v.ageSec) + (spdText(v) ? ' · ' + spdText(v) : '') + '</div></div>';
    }).join('');
  }

  var loadedOnce = false, busy = false;
  function banner(text, err) {
    var el = document.getElementById('banner');
    if (!text) { el.style.display = 'none'; return; }
    el.textContent = text; el.className = err ? 'err' : ''; el.style.display = 'block';
  }
  function refresh() {
    if (busy) return; busy = true;
    if (!loadedOnce) banner('데이터를 불러오는 중입니다… (처음 접속 시 10초 정도 걸릴 수 있습니다)');
    apiGet({ api: 'board' }).then(function (d) {
      busy = false; loadedOnce = true; banner('');
      render(d);
    }).catch(function (e) {
      busy = false;
      banner(errText(e), true);
      document.getElementById('upd').textContent = '연결 오류';
      if (!loadedOnce) setTimeout(refresh, 5000);
    });
  }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
